<style>

<body>
<header><div><strong>病気の症状をつたえよう</strong></div><nav class="modeLinks" aria-label="表示方法"><a href="?mode=preview" id="previewLink">🧍 カメラなしで人形を見る</a><a href="?mode=ar" id="arLink">📱 マーカー型ARを見る</a></nav></header>
<div id="arStatus">マーカーをカメラに映してください</div><button type="button" id="arStudyToggle" onclick="toggleArStudy()">日本語の練習を開く</button>
<main class="shell">
<section class="card" id="viewCard">
<div class="previewHead"><div><div class="eyebrow">3D ボディマップ</div><b>病気の症状をつたえよう</b></div></div>
<div id="sceneWrap"><div class="instructions">下のボタンで場所を選んでください。</div></div>
<div class="controls" id="guidePanel"><button class="btn" onclick="rotateModel(-35)">↶ 左に回す</button><button class="btn" onclick="rotateModel(35)">右に回す ↷</button><button class="btn" onclick="setFacing(false)">まえ</button><button class="btn" onclick="setFacing(true)">うしろ</button><button class="btn" onclick="resetCamera()">↻ リセット</button></div>
</section>
<section class="card" id="studyCard">
<div class="section"><h2>① 体の場所を選ぶ</h2><p class="quiet">体のどこが悪いか、人形を見てさがしましょう。熱や気分の悪さも選べます。</p><div class="chips" id="chips"></div></div>
<div class="section"><div class="eyebrow">選んだ場所・症状</div><div class="detailTitle" id="partTitle">おなかの上のほう</div><p class="quiet" id="partHelp"></p><h2>② 症状を選ぶ</h2><div class="symptoms" id="symptoms"></div><div style="display:flex;gap:8px;flex-wrap:wrap"><div style="flex:1;min-width:120px"><label for="when">いつから</label><select class="field" id="when"><option>今日の朝から</option><option>きのうから</option><option>2日前から</option><option>3日前から</option><option>1週間前から</option></select></div><div style="flex:1;min-width:120px"><label for="strength">どのくらい</label><select class="field" id="strength"><option>少し</option><option>とても</option></select></div></div><p class="example" id="sentence">きのうから、おなかの上のほうが少し痛いです。</p></div>
<div class="section"><h2>③ 医者の質問に答える</h2><div class="prompt" id="question">🩺 医者：「どうしましたか？」</div><div class="controls" style="padding:9px 0"><button class="btn primary" onclick="nextQuestion()">次の質問</button><button class="btn" onclick="newCase()">ほかの症状で練習</button></div></div>
<div class="section"><h2>④ ふり返り</h2><p class="quiet">話せたことにチェックをつけましょう。答えは保存されません。</p><div style="display:flex;flex-wrap:wrap;gap:12px;font-size:13px"><label><input type="checkbox"> 体の場所</label><label><input type="checkbox"> いつから</label><label><input type="checkbox"> 症状・どのくらい</label><label><input type="checkbox"> 質問に答える</label></div></div>
</section>
</main>

<script>
const arMode=new URLSearchParams(location.search).get('mode')==='ar';
if(arMode){document.body.classList.add('ar-mode');}
const PARTS=[
['forehead','あたま','','あたま'],['throat','のど','','のど'],['shoulder','かた','くびとうでのあいだ','かた'],['arm','うで','','右のうで'],['chest','むね','おなかの上','むね'],['solar','おなかの上のほう','','おなかの上のほう'],['lower','おなかの下のほう','おへその下あたり','おなかの下のほう'],['elbow','ひじ','うでをまげるところ','右のひじ'],['wrist','手くび','手とうでのあいだ','右の手くび'],['thigh','足の上のほう','ひざより上','右の足の上のほう'],['knee','ひざ','足を曲げるところ','右のひざ'],['shin','足の下のほう','ひざと足くびの間','右の足の下のほう'],['ankle','足くび','','右の足くび'],
['nape','くび','','くび'],['back','せなか','体の後ろ側','せなか'],['waist','こし','','こし'],['heel','かかと','','右のかかと'] ];
const byId=Object.fromEntries(PARTS.map(x=>[x[0],x]));
const opts=['痛い','ズキズキする','かゆい','はれている','熱があります','気分が悪い','はき気がする','せきが出る','めまいがする'];
let part='solar',sym='痛い',hide=false,q=0;
const questions=[
'🩺 医者：「どうしましたか？」',
'🩺 医者：「いつからですか？」',
'🩺 医者：「どんな症状がありますか？」',
'🩺 医者：「どのくらいつらいですか？」',
'🩺 医者：「ほかに症状はありますか？」'];
const generalSymptoms=['熱があります','気分が悪い','はき気がする','せきが出る','めまいがする'];
function render(){
 const p=byId[part],general=generalSymptoms.includes(sym);
 document.getElementById('partTitle').textContent=general?sym:p[1];
 document.getElementById('partHelp').textContent=general?'':(p[2]||'');
 document.querySelectorAll('.chip').forEach(b=>b.classList.toggle('active',!general&&b.dataset.part===part));
 document.querySelectorAll('.sym').forEach(b=>b.classList.toggle('active',b.dataset.sym===sym));
 const when=document.getElementById('when').value,strength=document.getElementById('strength').value;
 let sentence='';
 if(general){
   const endings={'熱があります':'熱があります。',
    '気分が悪い':`気分が${strength==='少し'?'少し':'とても'}悪いです。`,
    'はき気がする':'はき気がします。','せきが出る':'せきが出ます。','めまいがする':'めまいがします。'};
   sentence=`${when}、${endings[sym]}`;
 }else{
   const endings={'痛い':`${strength}痛いです。`,'ズキズキする':'ズキズキします。','かゆい':'かゆいです。','はれている':'はれています。'};
   sentence=`${when}、${p[3]}が${endings[sym]}`;
 }
 document.getElementById('sentence').textContent=sentence;

 document.getElementById('question').textContent=q===0?(general?'🩺 医者：「どうしましたか？」':'🩺 医者：「どうしましたか？」'):questions[q];
 document.querySelectorAll('[data-zone]').forEach(e=>{const active=!general&&e.getAttribute('data-zone')===part;e.setAttribute('material','color','#F23D4D');e.setAttribute('opacity',active?1:0);});
}
function choosePart(p){part=p;if(generalSymptoms.includes(sym))sym='痛い';const back=['nape','back','waist','heel'].includes(p);if(!arMode)setFacing(back);render();}

function nextQuestion(){q=(q+1)%questions.length;render()}
function newCase(){const a=PARTS[Math.floor(Math.random()*PARTS.length)];sym=opts[Math.floor(Math.random()*opts.length)];q=0;part=a[0];if(!arMode)setFacing(['nape','back','waist','heel'].includes(part));render();}
document.getElementById('when').addEventListener('change',render);document.getElementById('strength').addEventListener('change',render);
const chips=document.getElementById('chips');PARTS.forEach(p=>{let b=document.createElement('button');b.className='chip';b.dataset.part=p[0];b.textContent=p[1];b.onclick=()=>choosePart(p[0]);chips.append(b)});
const syms=document.getElementById('symptoms');opts.forEach(s=>{let b=document.createElement('button');b.className='sym';b.dataset.sym=s;b.textContent=s;b.onclick=()=>{sym=s;q=0;render()};syms.append(b)});
// Position list: each colored region is on a cheerful, deliberately simplified 3D figure.
// x,y,z, sx,sy,sz; positive z is front. Arms and legs are intentionally chubby.
const zones=[
['forehead',0,2.48,.50,.28,.13,.11],['throat',0,1.91,.36,.20,.20,.10],['shoulder',-.47,1.72,.1,.22,.16,.15],['arm',-.62,1.53,.21,.21,.21,.19],['chest',0,1.64,.32,.55,.30,.12],['solar',0,1.32,.36,.32,.20,.13],['lower',0,1.09,.31,.48,.23,.13],['elbow',-.64,1.31,.12,.21,.18,.18],['wrist',-.72,1.01,.12,.18,.11,.13],['thigh',-.24,.61,.15,.27,.33,.23],['knee',-.24,.36,.21,.23,.16,.17],['shin',-.24,.16,.16,.18,.23,.17],['ankle',-.25,-.13,.13,.16,.12,.13],
['nape',0,1.95,-.50,.19,.15,.12],['back',0,1.41,-.34,.29,.28,.12],['waist',0,1.05,-.27,.30,.17,.13],['heel',-.24,-.26,-.15,.20,.13,.16]
];
function ell(x,y,z,sx,sy,sz,color,zone){let p=`<a-sphere position="${x} ${y} ${z}" scale="${sx} ${sy} ${sz}" material="color:${color};shader:standard;roughness:0.85;side:double"`;
if(zone)p+=` class="clickable" data-zone="${zone}" data-original="${color}"`;return p+'></a-sphere>';}
let character='';
// pastel adorable body, big friendly head and small round ears
character+=ell(0,2.21,0,.40,.43,.37,'#ffe4bd');
character+=ell(-.4,2.20,0,.10,.15,.12,'#ffe4bd')+ell(.4,2.20,0,.10,.15,.12,'#ffe4bd');
// Manga-style hair cap, bangs, large expressive eyes and highlights.
character+=ell(0,2.48,-.085,.438,.24,.365,'#55427C');
// The back-of-head hair shell sits outside the skin surface and covers it from every rear angle.
character+=ell(0,2.23,-.32,.435,.39,.17,'#55427C');
character+=ell(-.24,2.25,-.25,.22,.36,.20,'#55427C')+ell(.24,2.25,-.25,.22,.36,.20,'#55427C');
// Keep the original front hairstyle and bangs.
character+=ell(-.35,2.29,-.04,.14,.29,.30,'#55427C')+ell(.35,2.29,-.04,.14,.29,.30,'#55427C');
character+=ell(-.18,2.45,.282,.24,.16,.15,'#55427C')+ell(.10,2.46,.31,.20,.15,.14,'#55427C')+ell(.32,2.43,.21,.11,.11,.12,'#55427C');
character+=ell(-.145,2.28,.358,.080,.105,.029,'#292B53')+ell(.145,2.28,.358,.080,.105,.029,'#292B53');
character+=ell(-.125,2.32,.387,.022,.025,.009,'#FFFFFF')+ell(.165,2.32,.387,.022,.025,.009,'#FFFFFF');
character+=ell(-.25,2.13,.35,.09,.055,.012,'#ffb0b6')+ell(.25,2.13,.35,.09,.055,.012,'#ffb0b6');
character+='<a-torus position="0 2.13 .365" radius="0.075" radius-tubular="0.013" arc="170" rotation="0 0 185" color="#b86278"></a-torus>';
character+=ell(0,1.43,0,.50,.66,.34,'#a9dbee')+ell(0,1.04,0,.40,.30,.28,'#9ad6e9');
for(const side of [-1,1]){const x=side*.61;character+=ell(x,1.46,0,.17,.44,.18,'#a9dbee')+ell(side*.69,.99,0,.155,.17,.16,'#ffe4bd')+ell(side*.23,.46,0,.22,.52,.23,'#bfc5fb')+ell(side*.23,-.04,0,.19,.32,.18,'#bfc5fb')+ell(side*.25,-.31,.09,.28,.12,.31,'#ffcf91');}
// The selected location is shown with the same-size red sphere (radius 0.095).
// Other markers stay hidden so the figure looks cleaner.
for(const z of zones){const r=(z[0]==='thigh')?0.105:0.095;character+=`<a-sphere class="clickable" data-zone="${z[0]}" data-original="#F23D4D" position="${z[1]} ${z[2]} ${z[3]}" radius="${r}" material="color:#F23D4D;shader:flat;side:double" opacity="0"></a-sphere>`;}
let markup='';
if(arMode){markup=`<a-scene embedded vr-mode-ui="enabled:false" renderer="logarithmicDepthBuffer:true" arjs="sourceType:webcam;debugUIEnabled:false;detectionMode:mono" cursor="rayOrigin:mouse" raycaster="objects:.clickable"><a-marker type="pattern" url="./my-icon-marker.patt" emitevents="true" id="arMarker" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5"><a-entity position="0 0 0" rotation="0 20 0" scale="1 1 1"><a-entity id="mascot" position="0 0.19 0" rotation="0 0 0" scale=".57 .57 .57">${character}</a-entity></a-entity></a-marker><a-light type="ambient" intensity="1.1"></a-light><a-light type="directional" position="-1 3 2" intensity="0.9"></a-light><a-entity camera></a-entity></a-scene>`;
// Keep the model upright in marker coordinates; lift its feet just above the marker. The marker smoothing settings reduce small tracking shakes.
}else{markup=`<a-scene embedded background="color:#F4F8FF" vr-mode-ui="enabled:false" cursor="rayOrigin:mouse" raycaster="objects:.clickable" renderer="antialias:true"><a-entity camera position="0 1.7 4.4" look-controls="enabled:false"><a-cursor raycaster="objects:.clickable" fuse="false" material="opacity:0" geometry="radius:0.001"></a-cursor></a-entity><a-light type="ambient" intensity="0.95"></a-light><a-light type="directional" intensity="0.4" position="-2 5 3"></a-light><a-entity id="mascot" position="0 -1.0 0" rotation="0 0 0" scale="1.16 1.16 1.16">${character}</a-entity><a-plane position="0 -1.3 -.2" rotation="-90 0 0" width="4" height="3" color="#EAF0FF"></a-plane></a-scene>`;}
document.getElementById('sceneWrap').insertAdjacentHTML('beforeend',markup);
let rotation=0;function rotateModel(v){rotation=(rotation+v+360)%360;const m=document.getElementById('mascot');if(m)m.setAttribute('rotation','0 '+rotation+' 0');}
function setFacing(back){rotation=back?180:0;if(!arMode){document.getElementById('mascot').setAttribute('rotation','0 '+rotation+' 0');}}
function resetCamera(){setFacing(false)}
function toggleArStudy(){
 document.body.classList.toggle('study-open');
 document.getElementById('arStudyToggle').textContent=
   document.body.classList.contains('study-open')
     ? '日本語の練習を閉じる':'日本語の練習を開く';
}
// AR uses the exact marker axis and keeps the body upright.
if(arMode){const marker=document.getElementById('arMarker');marker.addEventListener('markerFound',()=>document.getElementById('arStatus').textContent='✓ マーカーを認識しています');marker.addEventListener('markerLost',()=>document.getElementById('arStatus').textContent='マーカーをカメラに映してください');}
document.querySelectorAll('[data-zone]').forEach(e=>e.addEventListener('click',()=>choosePart(e.getAttribute('data-zone'))));
render();
</script>
