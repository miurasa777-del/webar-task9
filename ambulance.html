
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>タスク9-1 救急車WebAR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>

  <script>
    // カメラなしプレビューかどうか
    const previewMode =
      new URLSearchParams(location.search).has("preview");

    // マーカーARのときだけAR.jsを読み込む
    if (!previewMode) {
      document.write(
        '<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"><\/script>'
      );
    }
  </script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
    }

    #info {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 9999;
      background: rgba(255,255,255,0.92);
      padding: 12px;
      border-radius: 10px;
      color: #222;
      font-size: 14px;
    }

    #status {
      margin-top: 5px;
    }

    #mode-link {
      display: inline-block;
      margin-top: 8px;
      padding: 7px 12px;
      background: #2374b5;
      border-radius: 8px;
      color: white;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div id="info">
    <strong id="title">救急車WebAR</strong>
    <div id="status">読み込み中...</div>
    <a id="mode-link" href="#">
      表示モードを切り替える
    </a>
  </div>

  <script>
    const title = document.getElementById("title");
    const status = document.getElementById("status");
    const modeLink = document.getElementById("mode-link");

    // 救急車の3Dモデル
    // マーカーARとプレビューで共通使用
    const ambulanceModel = `
      <a-entity id="ambulance"
        position="0.15 0 0"
        rotation="0 0 0"
        scale="1 1 1">

        <!-- 車体後部 -->
        <a-box
          position="-0.15 0.22 0"
          width="0.40"
          height="0.30"
          depth="0.26"
          color="#FFFFFF">
        </a-box>

        <!-- 運転席 -->
        <a-box
          position="0.15 0.16 0"
          width="0.20"
          height="0.20"
          depth="0.26"
          color="#FFF5F6">
        </a-box>

        <!-- フロントガラス -->
        <a-box
          position="0.253 0.20 0"
          width="0.008"
          height="0.09"
          depth="0.19"
          color="#86D5F7">
        </a-box>

        <!-- 右側の窓 -->
        <a-box
          position="0.17 0.20 0.134"
          width="0.11"
          height="0.09"
          depth="0.008"
          color="#86D5F7">
        </a-box>

        <!-- 左側の窓 -->
        <a-box
          position="0.17 0.20 -0.134"
          width="0.11"
          height="0.09"
          depth="0.008"
          color="#86D5F7">
        </a-box>

        <!-- 赤いライン：右側 -->
        <a-box
          position="-0.15 0.17 0.135"
          width="0.40"
          height="0.025"
          depth="0.009"
          color="#F0445E">
        </a-box>

        <!-- 赤いライン：左側 -->
        <a-box
          position="-0.15 0.17 -0.135"
          width="0.40"
          height="0.025"
          depth="0.009"
          color="#F0445E">
        </a-box>

        <!-- 赤十字：右側 縦 -->
        <a-box
          position="-0.18 0.27 0.141"
          width="0.025"
          height="0.10"
          depth="0.01"
          color="#E52D4D">
        </a-box>

        <!-- 赤十字：右側 横 -->
        <a-box
          position="-0.18 0.27 0.143"
          width="0.10"
          height="0.025"
          depth="0.01"
          color="#E52D4D">
        </a-box>

        <!-- 赤十字：左側 縦 -->
        <a-box
          position="-0.18 0.27 -0.141"
          width="0.025"
          height="0.10"
          depth="0.01"
          color="#E52D4D">
        </a-box>

        <!-- 赤十字：左側 横 -->
        <a-box
          position="-0.18 0.27 -0.143"
          width="0.10"
          height="0.025"
          depth="0.01"
          color="#E52D4D">
        </a-box>

        <!-- 前タイヤ：右 -->
        <a-cylinder
          position="0.15 0.06 0.14"
          radius="0.065"
          height="0.04"
          rotation="90 0 0"
          color="#333333">
        </a-cylinder>

        <!-- 前タイヤ：左 -->
        <a-cylinder
          position="0.15 0.06 -0.14"
          radius="0.065"
          height="0.04"
          rotation="90 0 0"
          color="#333333">
        </a-cylinder>

        <!-- 後タイヤ：右 -->
        <a-cylinder
          position="-0.27 0.06 0.14"
          radius="0.065"
          height="0.04"
          rotation="90 0 0"
          color="#333333">
        </a-cylinder>

        <!-- 後タイヤ：左 -->
        <a-cylinder
          position="-0.27 0.06 -0.14"
          radius="0.065"
          height="0.04"
          rotation="90 0 0"
          color="#333333">
        </a-cylinder>

        <!-- ライトの台 -->
        <a-box
          position="-0.10 0.39 0"
          width="0.16"
          height="0.025"
          depth="0.10"
          color="#CCCCCC">
        </a-box>

        <!-- 赤い点滅ライト -->
        <a-box
          position="-0.14 0.42 0"
          width="0.065"
          height="0.04"
          depth="0.10"
          color="#FF2222"
          material="transparent: true; opacity: 1"
          animation="property: material.opacity;
                     from: 1;
                     to: 0.15;
                     dur: 400;
                     dir: alternate;
                     loop: true">
        </a-box>

        <!-- 青い点滅ライト -->
        <a-box
          position="-0.06 0.42 0"
          width="0.065"
          height="0.04"
          depth="0.10"
          color="#2266FF"
          material="transparent: true; opacity: 0.15"
          animation="property: material.opacity;
                     from: 0.15;
                     to: 1;
                     dur: 400;
                     dir: alternate;
                     loop: true">
        </a-box>

        <!-- フロントのライト -->
        <a-box
          position="0.257 0.115 0.075"
          width="0.01"
          height="0.035"
          depth="0.055"
          color="#FFF5A8">
        </a-box>

        <a-box
          position="0.257 0.115 -0.075"
          width="0.01"
          height="0.035"
          depth="0.055"
          color="#FFF5A8">
        </a-box>

      </a-entity>
    `;

    if (previewMode) {

      // カメラなしプレビュー
      title.textContent = "3D救急車｜プレビュー";
      status.textContent =
        "カメラを使わずに3Dモデルを表示しています";

      modeLink.textContent = "マーカーARを開く";
      modeLink.href = "./ambulance.html";

      document.body.insertAdjacentHTML(
        "beforeend",
        `
        <a-scene
          embedded
          vr-mode-ui="enabled: false"
          background="color: #DDEBF6">

          <a-entity
            light="type: ambient; intensity: 0.9">
          </a-entity>

          <a-entity
            light="type: directional; intensity: 0.8"
            position="1 3 2">
          </a-entity>

          <!-- 床 -->
          <a-plane
            position="0 -0.01 0"
            rotation="-90 0 0"
            width="4"
            height="4"
            color="#DDDDDD">
          </a-plane>

          <!-- 救急車を見やすい大きさで表示 -->
          <a-entity
            position="0 0 0"
            rotation="0 -30 0">
            ${ambulanceModel}
          </a-entity>

          <!-- 見る位置 -->
          <a-entity
            camera
            position="0 0.8 2.2"
            look-controls="enabled: false"
            rotation="-10 0 0">
          </a-entity>

        </a-scene>
        `
      );

    } else {

      // マーカー型AR
      title.textContent = "3D救急車｜マーカーAR";

      status.textContent =
        "AR.jsマーカーを映してください";

      modeLink.textContent =
        "カメラなしで救急車を見る";

      modeLink.href = "?preview=1";

      document.body.insertAdjacentHTML(
        "beforeend",
        `
        <a-scene
          embedded
          vr-mode-ui="enabled: false"
          renderer="logarithmicDepthBuffer: true"
          arjs="sourceType: webcam;
                debugUIEnabled: false;
                detectionMode: mono;">

          <a-marker
            id="marker"
            type="pattern"
            url="./my-icon-marker.patt"
            emitevents="true">

            <!-- 救急車をマーカー上に配置 -->
            ${ambulanceModel}

          </a-marker>

          <a-entity camera></a-entity>

        </a-scene>
        `
      );

      const marker = document.getElementById("marker");

      marker.addEventListener("markerFound", () => {
        status.textContent =
          "✓ マーカーを認識しています";
      });

      marker.addEventListener("markerLost", () => {
        status.textContent =
          "AR.jsマーカーを映してください";
      });

    }
  </script>

</body>
</html>
