
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>タスク9-1 動く救急車AR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>

  <script>
    const previewMode =
      new URLSearchParams(location.search).has("preview");

    // ARモードのときだけAR.jsを読み込む
    if (!previewMode) {
      document.write(
        '<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"><\/script>'
      );
    }

    // 車体の移動とタイヤの回転を連動させる
    AFRAME.registerComponent("drive-motion", {
      schema: {
        distance: {type: "number", default: 0.22},
        duration: {type: "number", default: 4400},
        wheelRadius: {type: "number", default: 0.065}
      },

      init: function () {
        this.wheels =
          Array.from(this.el.querySelectorAll(".wheel"));
      },

      tick: function (time) {
        const d = this.data;

        // 0 → 最大距離 → 0 の往復移動
        const phase =
          (time % d.duration) / d.duration;

        const travel =
          d.distance *
          (1 - Math.cos(phase * Math.PI * 2)) / 2;

        // 車体の前後移動
        this.el.object3D.position.x = travel;

        // 移動距離からタイヤの回転角度を計算
        const angle = -travel / d.wheelRadius;

        this.wheels.forEach(wheel => {
          wheel.object3D.rotation.z = angle;
        });
      }
    });
  </script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
    }

    #info {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 9999;
      padding: 12px;
      border-radius: 10px;
      background: rgba(255,255,255,0.92);
      color: #222;
      font-size: 14px;
    }

    #status {
      margin-top: 6px;
    }

    #mode-link {
      display: inline-block;
      margin-top: 8px;
      padding: 8px 12px;
      background: #087cbe;
      color: white;
      border-radius: 8px;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div id="info">
    <strong id="title">3D救急車 WebAR</strong>
    <div id="status">読み込み中...</div>

    <a id="mode-link" href="#">
      表示モードを切り替える
    </a>
  </div>

  <script>
    const title = document.getElementById("title");
    const status = document.getElementById("status");
    const modeLink = document.getElementById("mode-link");

    // =====================================
    // タイヤを作成する関数
    // =====================================

    function makeWheel(x, z) {

      // 外側のホイールの位置
      const side = z > 0 ? 1 : -1;

      return `
        <a-entity
          class="wheel"
          position="${x} 0.065 ${z}">

          <!-- 黒いタイヤ本体 -->
          <a-cylinder
            radius="0.065"
            height="0.04"
            rotation="90 0 0"
            color="#252525">
          </a-cylinder>

          <!-- 銀色のホイール -->
          <a-cylinder
            position="0 0 ${side * 0.022}"
            radius="0.038"
            height="0.007"
            rotation="90 0 0"
            color="#D0D5DB">
          </a-cylinder>

          <!-- 回転が見える赤い目印 -->
          <a-box
            position="0.025 0 ${side * 0.028}"
            width="0.032"
            height="0.009"
            depth="0.006"
            color="#F0445E">
          </a-box>

          <!-- ホイールの中央 -->
          <a-cylinder
            position="0 0 ${side * 0.028}"
            radius="0.01"
            height="0.008"
            rotation="90 0 0"
            color="#666666">
          </a-cylinder>

        </a-entity>
      `;
    }

    // =====================================
    // 救急車の3Dモデル
    // =====================================

    const ambulanceModel = `

      <!--
        外側のグループ：
        救急車全体の位置・向き・大きさ
      -->
      <a-entity
        id="ambulance-placement"
        position="0.15 0 0"
        rotation="0 45 0"
        scale="0.8 0.8 0.8">

        <!--
          内側のグループ：
          前後移動とタイヤ回転を制御
        -->
        <a-entity
          id="ambulance"
          drive-motion="
            distance: 0.22;
            duration: 4400;
            wheelRadius: 0.065">

          <!-- 車体後部 -->
          <a-box
            position="-0.15 0.22 0"
            width="0.40"
            height="0.30"
            depth="0.26"
            color="#FFFFFF">
          </a-box>

          <!-- 運転席 -->
          <a-box
            position="0.15 0.16 0"
            width="0.20"
            height="0.20"
            depth="0.26"
            color="#FFF5F6">
          </a-box>

          <!-- フロントガラス -->
          <a-box
            position="0.253 0.20 0"
            width="0.008"
            height="0.09"
            depth="0.19"
            color="#86D5F7">
          </a-box>

          <!-- 右側の窓 -->
          <a-box
            position="0.17 0.20 0.134"
            width="0.11"
            height="0.09"
            depth="0.008"
            color="#86D5F7">
          </a-box>

          <!-- 左側の窓 -->
          <a-box
            position="0.17 0.20 -0.134"
            width="0.11"
            height="0.09"
            depth="0.008"
            color="#86D5F7">
          </a-box>

          <!-- 赤いライン：右 -->
          <a-box
            position="-0.15 0.17 0.135"
            width="0.40"
            height="0.025"
            depth="0.009"
            color="#F0445E">
          </a-box>

          <!-- 赤いライン：左 -->
          <a-box
            position="-0.15 0.17 -0.135"
            width="0.40"
            height="0.025"
            depth="0.009"
            color="#F0445E">
          </a-box>

          <!-- 赤十字：右側 -->
          <a-box
            position="-0.18 0.27 0.141"
            width="0.025"
            height="0.10"
            depth="0.01"
            color="#E52D4D">
          </a-box>

          <a-box
            position="-0.18 0.27 0.143"
            width="0.10"
            height="0.025"
            depth="0.01"
            color="#E52D4D">
          </a-box>

          <!-- 赤十字：左側 -->
          <a-box
            position="-0.18 0.27 -0.141"
            width="0.025"
            height="0.10"
            depth="0.01"
            color="#E52D4D">
          </a-box>

          <a-box
            position="-0.18 0.27 -0.143"
            width="0.10"
            height="0.025"
            depth="0.01"
            color="#E52D4D">
          </a-box>

          <!-- 前輪2本 -->
          ${makeWheel(0.15, 0.14)}
          ${makeWheel(0.15, -0.14)}

          <!-- 後輪2本 -->
          ${makeWheel(-0.27, 0.14)}
          ${makeWheel(-0.27, -0.14)}

          <!-- ライトの土台 -->
          <a-box
            position="-0.10 0.39 0"
            width="0.16"
            height="0.025"
            depth="0.10"
            color="#CCCCCC">
          </a-box>

          <!-- 赤い点滅ライト -->
          <a-box
            position="-0.14 0.42 0"
            width="0.065"
            height="0.04"
            depth="0.10"
            color="#FF2222"
            material="transparent: true; opacity: 1"

            animation="
              property: material.opacity;
              from: 1;
              to: 0.15;
              dur: 400;
              dir: alternate;
              loop: true">
          </a-box>

          <!-- 青い点滅ライト -->
          <a-box
            position="-0.06 0.42 0"
            width="0.065"
            height="0.04"
            depth="0.10"
            color="#2266FF"
            material="transparent: true; opacity: 0.15"

            animation="
              property: material.opacity;
              from: 0.15;
              to: 1;
              dur: 400;
              dir: alternate;
              loop: true">
          </a-box>

          <!-- 右ヘッドライト -->
          <a-box
            position="0.257 0.115 0.075"
            width="0.01"
            height="0.035"
            depth="0.055"
            color="#FFF5A8">
          </a-box>

          <!-- 左ヘッドライト -->
          <a-box
            position="0.257 0.115 -0.075"
            width="0.01"
            height="0.035"
            depth="0.055"
            color="#FFF5A8">
          </a-box>

        </a-entity>
      </a-entity>
    `;

    // =====================================
    // カメラなしプレビュー
    // =====================================

    if (previewMode) {

      title.textContent =
        "3D救急車｜プレビュー";

      status.textContent =
        "前後移動・タイヤ回転・ライト点滅";

      modeLink.textContent =
        "マーカーARを開く";

      modeLink.href = "./ambulance.html";

      document.body.insertAdjacentHTML(
        "beforeend",
        `
        <a-scene
          embedded
          vr-mode-ui="enabled: false"
          background="color: #DDEBF6">

          <!-- 環境光 -->
          <a-entity
            light="type: ambient; intensity: 0.9">
          </a-entity>

          <!-- 方向光 -->
          <a-entity
            light="type: directional; intensity: 0.8"
            position="1 3 2">
          </a-entity>

          <!-- 床 -->
          <a-plane
            position="0 -0.01 0"
            rotation="-90 0 0"
            width="4"
            height="4"
            color="#DDDDDD">
          </a-plane>

          <!-- 救急車 -->
          ${ambulanceModel}

          <!-- プレビュー用カメラ -->
          <a-entity
            camera
            position="0 0.7 1.8"
            look-controls="enabled: false"
            rotation="-12 0 0">
          </a-entity>

        </a-scene>
        `
      );

    } else {

      // =====================================
      // マーカー型AR
      // =====================================

      title.textContent =
        "3D救急車｜マーカーAR";

      status.textContent =
        "AR.jsマーカーを映してください";

      modeLink.textContent =
        "カメラなしで救急車を見る";

      modeLink.href = "?preview=1";

      document.body.insertAdjacentHTML(
        "beforeend",
        `
        <a-scene
          embedded
          vr-mode-ui="enabled: false"
          renderer="logarithmicDepthBuffer: true"

          arjs="
            sourceType: webcam;
            debugUIEnabled: false;
            detectionMode: mono;">

          <a-marker
            id="marker"
            type="pattern"
            url="./my-icon-marker.patt"
            emitevents="true">

            ${ambulanceModel}

          </a-marker>

          <a-entity camera></a-entity>

        </a-scene>
        `
      );

      const marker = document.getElementById("marker");

      marker.addEventListener("markerFound", () => {
        status.textContent =
          "✓ マーカーを認識しています";
      });

      marker.addEventListener("markerLost", () => {
        status.textContent =
          "AR.jsマーカーを映してください";
      });

    }
  </script>

</body>
</html>
