
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>タスク9-1 青い立方体WebAR</title>

  <!-- 参考作品に合わせたバージョン -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>

  <script>
    // ?preview=1 の場合はカメラを起動しない
    const previewMode =
      new URLSearchParams(location.search).has("preview");

    if (!previewMode) {
      document.write(
        '<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"><\/script>'
      );
    }
  </script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
    }

    #info {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 9999;
      background: rgba(255,255,255,0.92);
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      color: #222;
    }

    #mode-link {
      display: inline-block;
      margin-top: 8px;
      padding: 7px 12px;
      border-radius: 8px;
      background: #2374b5;
      color: white;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div id="info">
    <strong id="title">タスク9-1 WebAR</strong>
    <div id="status">読み込み中...</div>
    <a id="mode-link" href="#">表示モードを切り替える</a>
  </div>

  <script>
    const title = document.getElementById("title");
    const status = document.getElementById("status");
    const modeLink = document.getElementById("mode-link");

    if (previewMode) {

      // カメラなしの3Dプレビュー
      title.textContent = "青い立方体｜プレビュー";
      status.textContent = "カメラを使用しない3D表示です";
      modeLink.textContent = "マーカーARを開く";
      modeLink.href = "./";

      document.body.insertAdjacentHTML(
        "beforeend",
        `
        <a-scene
          embedded
          vr-mode-ui="enabled: false"
          background="color: #dbe9f4">

          <a-entity
            light="type: ambient; intensity: 0.9">
          </a-entity>

          <a-entity
            light="type: directional; intensity: 0.8"
            position="1 3 2">
          </a-entity>

          <a-plane
            position="0 0 0"
            rotation="-90 0 0"
            width="4"
            height="4"
            color="#dddddd">
          </a-plane>

          <a-box
            position="0 0.25 0"
            rotation="0 45 0"
            width="0.5"
            height="0.5"
            depth="0.5"
            color="#4CC3D9">
          </a-box>

          <a-entity
            camera
            position="0 0.8 2.5"
            look-controls="enabled: false"
            rotation="-10 0 0">
          </a-entity>

        </a-scene>
        `
      );

    } else {

      // 独自マーカーを使うAR
      title.textContent = "青い立方体｜マーカーAR";
      status.textContent = "AR.jsマーカーを映してください";
      modeLink.textContent = "カメラなしで3Dを見る";
      modeLink.href = "?preview=1";

      document.body.insertAdjacentHTML(
        "beforeend",
        `
        <a-scene
          embedded
          vr-mode-ui="enabled: false"
          renderer="logarithmicDepthBuffer: true"
          arjs="sourceType: webcam;
                debugUIEnabled: false;
                detectionMode: mono;">

          <a-marker
            id="marker"
            type="pattern"
            url="./my-icon-marker.patt"
            emitevents="true">

            <a-box
              position="0 0.15 0"
              rotation="0 45 0"
              width="0.3"
              height="0.3"
              depth="0.3"
              color="#4CC3D9">
            </a-box>

          </a-marker>

          <a-entity camera></a-entity>

        </a-scene>
        `
      );

      const marker = document.getElementById("marker");

      marker.addEventListener("markerFound", () => {
        status.textContent = "✓ マーカーを認識しています";
      });

      marker.addEventListener("markerLost", () => {
        status.textContent = "AR.jsマーカーを映してください";
      });

    }
  </script>

</body>
</html>
