
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>タスク9-1 WebAR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- AR.js -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin:0; overflow:hidden;">

  <a-scene
    embedded
    vr-mode-ui="enabled:false"
    renderer="logarithmicDepthBuffer: true"
    arjs="sourceType:webcam; debugUIEnabled:false;">

    <!-- タスク14で作成した独自マーカー -->
    <a-marker
      id="marker"
      type="pattern"
      url="./my-icon-marker.patt"
      emitevents="true">

<a-entity
  position="0 0 0"
  rotation="180 0 0"
  scale="0.8 0.8 0.8"
  animation="property: position; dir: alternate; dur: 2000; loop: true; to: 0.18 0 0">

  <!-- 地面 -->
  <a-cylinder
    position="0 0.01 0"
    radius="0.32"
    height="0.02"
    color="#f7c7d8">
  </a-cylinder>

  <!-- 救急車本体 -->
  <a-box
    position="0 0.08 0"
    width="0.28"
    height="0.10"
    depth="0.14"
    color="#ffffff">
  </a-box>

  <!-- 後ろ上部 -->
  <a-box
    position="-0.03 0.14 0"
    width="0.16"
    height="0.08"
    depth="0.14"
    color="#ffffff">
  </a-box>

  <!-- 運転席 -->
  <a-box
    position="0.09 0.13 0"
    width="0.08"
    height="0.07"
    depth="0.14"
    color="#ffe4ec">
  </a-box>

  <!-- フロントガラス -->
  <a-box
    position="0.125 0.14 0"
    width="0.01"
    height="0.05"
    depth="0.10"
    color="#aee3ff">
  </a-box>

  <!-- 横の窓 -->
  <a-box
    position="0.085 0.145 0.071"
    width="0.05"
    height="0.035"
    depth="0.01"
    color="#aee3ff">
  </a-box>

  <a-box
    position="0.085 0.145 -0.071"
    width="0.05"
    height="0.035"
    depth="0.01"
    color="#aee3ff">
  </a-box>

  <!-- 赤いライン -->
  <a-box
    position="0 0.09 0.071"
    width="0.26"
    height="0.02"
    depth="0.01"
    color="#ff6b81">
  </a-box>

  <a-box
    position="0 0.09 -0.071"
    width="0.26"
    height="0.02"
    depth="0.01"
    color="#ff6b81">
  </a-box>

  <!-- 十字マーク風（左右） -->
  <a-box
    position="-0.02 0.12 0.071"
    width="0.018"
    height="0.05"
    depth="0.01"
    color="#ff4d4d">
  </a-box>

  <a-box
    position="-0.02 0.12 0.071"
    width="0.05"
    height="0.018"
    depth="0.01"
    color="#ff4d4d">
  </a-box>

  <a-box
    position="-0.02 0.12 -0.071"
    width="0.018"
    height="0.05"
    depth="0.01"
    color="#ff4d4d">
  </a-box>

  <a-box
    position="-0.02 0.12 -0.071"
    width="0.05"
    height="0.018"
    depth="0.01"
    color="#ff4d4d">
  </a-box>

  <!-- タイヤ -->
  <a-cylinder
    position="-0.08 0.035 0.08"
    radius="0.03"
    height="0.03"
    rotation="90 0 0"
    color="#333333"
    animation="property: rotation; to: 450 0 0; loop: true; dur: 1000; easing: linear">
  </a-cylinder>

  <a-cylinder
    position="0.08 0.035 0.08"
    radius="0.03"
    height="0.03"
    rotation="90 0 0"
    color="#333333"
    animation="property: rotation; to: 450 0 0; loop: true; dur: 1000; easing: linear">
  </a-cylinder>

  <a-cylinder
    position="-0.08 0.035 -0.08"
    radius="0.03"
    height="0.03"
    rotation="90 0 0"
    color="#333333"
    animation="property: rotation; to: 450 0 0; loop: true; dur: 1000; easing: linear">
  </a-cylinder>

  <a-cylinder
    position="0.08 0.035 -0.08"
    radius="0.03"
    height="0.03"
    rotation="90 0 0"
    color="#333333"
    animation="property: rotation; to: 450 0 0; loop: true; dur: 1000; easing: linear">
  </a-cylinder>

  <!-- ライトバー台 -->
  <a-box
    position="0.02 0.19 0"
    width="0.08"
    height="0.02"
    depth="0.05"
    color="#eeeeee">
  </a-box>

  <!-- 赤ライト -->
  <a-box
    position="-0.005 0.20 0"
    width="0.03"
    height="0.02"
    depth="0.05"
    color="#ff0000"
    animation="property: material.opacity; from: 1; to: 0.2; dir: alternate; dur: 300; loop: true">
  </a-box>

  <!-- 青ライト -->
  <a-box
    position="0.045 0.20 0"
    width="0.03"
    height="0.02"
    depth="0.05"
    color="#0066ff"
    animation="property: material.opacity; from: 0.2; to: 1; dir: alternate; dur: 300; loop: true">
  </a-box>

</a-entity>

    </a-marker>

    <!-- カメラ -->
    <a-entity camera></a-entity>

  </a-scene>

  <!-- マーカー認識の確認 -->
  <div id="status"
       style="
         position:fixed;
         top:12px;
         left:12px;
         z-index:9999;
         background:rgba(255,255,255,0.9);
         color:#222;
         padding:10px;
         border-radius:8px;
         font-size:14px;">
    AR.jsマーカーを映してください
  </div>

  <script>
    const marker = document.querySelector("#marker");
    const status = document.querySelector("#status");

    marker.addEventListener("markerFound", function() {
      status.textContent = "✓ マーカーを認識しています";
    });

    marker.addEventListener("markerLost", function() {
      status.textContent = "AR.jsマーカーを映してください";
    });
  </script>

</body>
</html>
