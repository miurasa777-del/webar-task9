
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>タスク9-1 WebAR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- AR.js -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin:0; overflow:hidden;">

  <a-scene
    embedded
    vr-mode-ui="enabled:false"
    renderer="logarithmicDepthBuffer: true"
    arjs="sourceType:webcam; debugUIEnabled:false;">

    <!-- タスク14で作成した独自マーカー -->
    <a-marker
      id="marker"
      type="pattern"
      url="./my-icon-marker.patt"
      emitevents="true">

     <a-entity
  position="0 0 0"
  animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear">

  <!-- 台 -->
  <a-cylinder
    position="0 0.01 0"
    radius="0.30"
    height="0.02"
    color="#f7c7d8">
  </a-cylinder>

  <!-- 病院の本体 -->
  <a-box
    position="0 0.13 0"
    width="0.32"
    height="0.22"
    depth="0.22"
    color="#fff0f5">
  </a-box>

  <!-- 上の部分 -->
  <a-box
    position="0 0.27 0"
    width="0.20"
    height="0.10"
    depth="0.15"
    color="#ffe4ec">
  </a-box>

  <!-- ドア -->
  <a-box
    position="0 0.07 0.115"
    width="0.06"
    height="0.12"
    depth="0.01"
    color="#8fd3ff">
  </a-box>

  <!-- 左の窓 -->
  <a-box
    position="-0.09 0.15 0.115"
    width="0.05"
    height="0.05"
    depth="0.01"
    color="#cfefff">
  </a-box>

  <!-- 右の窓 -->
  <a-box
    position="0.09 0.15 0.115"
    width="0.05"
    height="0.05"
    depth="0.01"
    color="#cfefff">
  </a-box>

  <!-- 上の左窓 -->
  <a-box
    position="-0.05 0.27 0.08"
    width="0.04"
    height="0.04"
    depth="0.01"
    color="#cfefff">
  </a-box>

  <!-- 上の右窓 -->
  <a-box
    position="0.05 0.27 0.08"
    width="0.04"
    height="0.04"
    depth="0.01"
    color="#cfefff">
  </a-box>

  <!-- 赤十字（たて） -->
  <a-box
    position="0 0.27 0.081"
    width="0.025"
    height="0.08"
    depth="0.01"
    color="#ff5b6e">
  </a-box>

  <!-- 赤十字（よこ） -->
  <a-box
    position="0 0.27 0.081"
    width="0.08"
    height="0.025"
    depth="0.01"
    color="#ff5b6e">
  </a-box>

</a-entity>

    </a-marker>

    <!-- カメラ -->
    <a-entity camera></a-entity>

  </a-scene>

  <!-- マーカー認識の確認 -->
  <div id="status"
       style="
         position:fixed;
         top:12px;
         left:12px;
         z-index:9999;
         background:rgba(255,255,255,0.9);
         color:#222;
         padding:10px;
         border-radius:8px;
         font-size:14px;">
    AR.jsマーカーを映してください
  </div>

  <script>
    const marker = document.querySelector("#marker");
    const status = document.querySelector("#status");

    marker.addEventListener("markerFound", function() {
      status.textContent = "✓ マーカーを認識しています";
    });

    marker.addEventListener("markerLost", function() {
      status.textContent = "AR.jsマーカーを映してください";
    });
  </script>

</body>
</html>
