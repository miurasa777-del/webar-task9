
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>タスク9-1 青い立方体AR</title>

  <!-- 救急車で使用しているA-Frame -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>

  <!-- 救急車で使用しているAR.js -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
    }

    #panel {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 99999;
      padding: 12px;
      background: rgba(255,255,255,0.93);
      border-radius: 10px;
      color: #222;
      font-size: 14px;
    }

    #status {
      margin-top: 6px;
    }

    #switch {
      display: inline-block;
      margin-top: 8px;
      padding: 9px 14px;
      background: #2374b5;
      color: white;
      border-radius: 8px;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div id="panel">
    <strong>青い立方体｜マーカー型AR</strong>

    <div id="status">
      AR.jsマーカーを映してください
    </div>

    <a id="switch" href="./cube-preview.html">
      カメラなしプレビューを見る
    </a>
  </div>

  <script>
    // 救急車と同じ方式でAR画面を生成
    document.body.insertAdjacentHTML(
      "beforeend",
      `
      <a-scene
        embedded
        vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true"
        arjs="sourceType: webcam;
              debugUIEnabled: false;
              detectionMode: mono;">

        <!-- 独自マーカー -->
        <a-marker
          id="marker"
          type="pattern"
          url="./my-icon-marker.patt"
          emitevents="true">

          <!-- 青い立方体 -->
          <a-entity
            position="0.15 0 0"
            rotation="0 20 0"
            scale="0.8 0.8 0.8">

            <a-box
              position="0 0.20 0"
              width="0.4"
              height="0.4"
              depth="0.4"
              color="#4CC3D9"
              material="shader: flat">
            </a-box>

          </a-entity>

        </a-marker>

        <a-entity camera></a-entity>
      </a-scene>
      `
    );

    // マーカー認識状態
    const marker = document.getElementById("marker");
    const status = document.getElementById("status");

    marker.addEventListener("markerFound", () => {
      status.textContent =
        "✓ マーカーを認識しています";
    });

    marker.addEventListener("markerLost", () => {
      status.textContent =
        "AR.jsマーカーを映してください";
    });
  </script>

</body>
</html>
