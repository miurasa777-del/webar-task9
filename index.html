
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>タスク9-1 青い立方体WebAR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>

  <script>
    // URLの ?preview=1 を確認
    const previewMode =
      new URLSearchParams(window.location.search)
        .get("preview") === "1";

    // マーカー型ARの場合だけAR.jsを読み込む
    if (!previewMode) {
      document.write(
        '<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"><\/script>'
      );
    }
  </script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
    }

    a-scene {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    #info {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 9999;
      background: rgba(255,255,255,0.92);
      padding: 12px;
      border-radius: 10px;
      color: #222;
      font-size: 14px;
    }

    #status {
      margin-top: 6px;
    }

    #mode-link {
      display: inline-block;
      margin-top: 8px;
      padding: 8px 12px;
      background: #087cbe;
      border-radius: 8px;
      color: white;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div id="info">
    <strong id="title">青い立方体WebAR</strong>

    <div id="status">読み込み中...</div>

    <a id="mode-link" href="#">
      表示モードを切り替える
    </a>
  </div>

  <script>
    const title = document.getElementById("title");
    const status = document.getElementById("status");
    const modeLink = document.getElementById("mode-link");

    if (previewMode) {

      // ==================================
      // カメラなしプレビュー
      // ==================================

      title.textContent =
        "青い立方体｜プレビュー";

      status.textContent =
        "カメラを使わない3D表示です";

      modeLink.textContent =
        "マーカー型ARを開く";

      modeLink.href = "./";

      document.body.insertAdjacentHTML(
        "beforeend",
        `
        <a-scene
          vr-mode-ui="enabled: false"
          background="color: #DDEBF6">

          <!-- 水色の背景 -->
          <a-sky color="#DDEBF6"></a-sky>

          <!-- 環境光 -->
          <a-entity
            light="type: ambient; intensity: 0.9">
          </a-entity>

          <!-- 方向光 -->
          <a-entity
            light="type: directional; intensity: 0.8"
            position="1 3 2">
          </a-entity>

          <!-- グレーの床 -->
          <a-plane
            position="0 -0.01 0"
            rotation="-90 0 0"
            width="4"
            height="4"
            color="#A7B0BA">
          </a-plane>

          <!-- 青い立方体 -->
          <a-box
            position="0 0.25 0"
            rotation="0 45 0"
            width="0.5"
            height="0.5"
            depth="0.5"
            color="#4CC3D9">
          </a-box>

          <!-- プレビュー用カメラ -->
          <a-entity
            camera="active: true"
            position="0 0.75 2"
            rotation="-12 0 0"
            look-controls="enabled: false">
          </a-entity>

        </a-scene>
        `
      );

    } else {

      // ==================================
      // マーカー型AR
      // ==================================

      title.textContent =
        "青い立方体｜マーカーAR";

      status.textContent =
        "AR.jsマーカーを映してください";

      modeLink.textContent =
        "カメラなしで3Dを見る";

      modeLink.href = "?preview=1";

      document.body.insertAdjacentHTML(
        "beforeend",
        `
        <a-scene
          embedded
          vr-mode-ui="enabled: false"
          renderer="logarithmicDepthBuffer: true"
          arjs="sourceType: webcam;
                debugUIEnabled: false;
                detectionMode: mono;">

          <!-- 独自マーカー -->
          <a-marker
            id="marker"
            type="pattern"
            url="./my-icon-marker.patt"
            emitevents="true">

            <!-- 青い3D立方体 -->
            <a-box
              position="0 0.10 0"
              rotation="0 45 0"
              width="0.2"
              height="0.2"
              depth="0.2"
              color="#4CC3D9">
            </a-box>

          </a-marker>

          <!-- AR用カメラ -->
          <a-entity camera></a-entity>

        </a-scene>
        `
      );

      const marker =
        document.getElementById("marker");

      marker.addEventListener("markerFound", () => {
        status.textContent =
          "✓ マーカーを認識しています";
      });

      marker.addEventListener("markerLost", () => {
        status.textContent =
          "AR.jsマーカーを映してください";
      });

    }
  </script>

</body>
</html>
