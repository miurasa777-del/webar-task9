
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>青い立方体｜3Dプレビュー</title>

  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
    }

    #panel {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 99999;
      padding: 12px;
      background: rgba(255,255,255,0.94);
      border-radius: 10px;
      color: #222;
    }

    #switch {
      display: inline-block;
      margin-top: 9px;
      padding: 10px 15px;
      background: #2374b5;
      color: white;
      border-radius: 8px;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div id="panel">
    <strong>青い立方体｜カメラなしプレビュー</strong>
    <div>カメラを使わない3D表示です。</div>

    <a id="switch" href="./index.html">
      マーカー型ARに戻る
    </a>
  </div>

  <a-scene
    vr-mode-ui="enabled: false"
    background="color: #DDEBF6">

    <a-sky color="#DDEBF6"></a-sky>

    <a-entity
      light="type: ambient; intensity: 0.9">
    </a-entity>

    <a-entity
      light="type: directional; intensity: 0.8"
      position="1 3 2">
    </a-entity>

    <!-- グレーの床 -->
    <a-plane
      position="0 -0.01 0"
      rotation="-90 0 0"
      width="4"
      height="4"
      color="#A7B0BA">
    </a-plane>

    <!-- 青い立方体 -->
    <a-box
      position="0 0.35 0"
      rotation="0 45 0"
      width="0.7"
      height="0.7"
      depth="0.7"
      color="#4CC3D9">
    </a-box>

    <!-- プレビュー用カメラ -->
    <a-entity
      camera="active: true"
      position="0 1.0 2.5"
      rotation="-15 0 0"
      look-controls="enabled: false">
    </a-entity>

  </a-scene>

</body>
</html>
